<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Métodos Numéricos — Integración</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.0/math.js"></script>
  <style>
    /* ══════════════════════════════════════════════
       PANTALLA DE CARGA
    ══════════════════════════════════════════════ */
    #splash-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: linear-gradient(160deg, #0d1b3e 0%, #162250 55%, #1e3a6e 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: opacity .6s ease, visibility .6s ease;
    }

    #splash-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-topline {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #e8b84b 30%, #f5d080 50%, #e8b84b 70%, transparent);
      animation: spl-shimmer 2.5s ease-in-out infinite;
    }

    @keyframes spl-shimmer {

      0%,
      100% {
        opacity: .6;
      }

      50% {
        opacity: 1;
      }
    }

    .splash-bg-symbol {
      position: absolute;
      font-family: 'DM Serif Display', serif;
      font-size: clamp(14rem, 35vw, 26rem);
      color: rgba(232, 184, 75, .04);
      line-height: 1;
      user-select: none;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .spl-particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(232, 184, 75, .1);
      animation: spl-float linear infinite;
    }

    @keyframes spl-float {
      0% {
        transform: translateY(0) scale(1);
        opacity: .12;
      }

      50% {
        transform: translateY(-28px) scale(1.12);
        opacity: .22;
      }

      100% {
        transform: translateY(0) scale(1);
        opacity: .12;
      }
    }

    .splash-inner {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 520px;
      padding: 0 24px;
    }

    .splash-icon {
      font-family: 'DM Serif Display', serif;
      font-size: 4.2rem;
      color: #e8b84b;
      line-height: 1;
      margin-bottom: 10px;
      animation: spl-pulse 2.2s ease-in-out infinite;
    }

    @keyframes spl-pulse {

      0%,
      100% {
        text-shadow: 0 0 0 rgba(232, 184, 75, 0);
      }

      50% {
        text-shadow: 0 0 32px rgba(232, 184, 75, .5);
      }
    }

    .splash-title {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(1.6rem, 5vw, 2rem);
      color: #fff;
      text-align: center;
      margin-bottom: 4px;
    }

    .splash-title span {
      color: #e8b84b;
    }

    .splash-sub {
      font-family: 'DM Sans', sans-serif;
      font-size: .7rem;
      letter-spacing: .13em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, .38);
      margin-bottom: 22px;
      text-align: center;
    }

    .splash-divider {
      width: 56px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #e8b84b, transparent);
      margin-bottom: 22px;
    }

    .splash-badges {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 22px;
      opacity: 0;
      transition: opacity .7s ease;
    }

    .splash-badges.spl-vis {
      opacity: 1;
    }

    .splash-badge {
      background: rgba(46, 91, 189, .2);
      border: 1px solid rgba(74, 125, 232, .3);
      color: rgba(255, 255, 255, .55);
      font-family: 'DM Sans', sans-serif;
      font-size: .6rem;
      font-weight: 600;
      letter-spacing: .08em;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
    }

    .splash-made-by {
      font-family: 'DM Sans', sans-serif;
      font-size: .63rem;
      font-weight: 600;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, .3);
      margin-bottom: 14px;
    }

    .splash-members {
      display: flex;
      flex-direction: column;
      gap: 9px;
      width: 100%;
      margin-bottom: 28px;
    }

    .spl-card {
      display: flex;
      align-items: center;
      gap: 13px;
      background: rgba(255, 255, 255, .055);
      border: 1px solid rgba(232, 184, 75, .16);
      border-radius: 10px;
      padding: 10px 15px;
      opacity: 0;
      transform: translateX(-22px);
      transition: opacity .5s ease, transform .5s ease, background .2s, border-color .2s;
    }

    .spl-card:hover {
      background: rgba(255, 255, 255, .1);
      border-color: rgba(232, 184, 75, .38);
    }

    .spl-card.spl-vis {
      opacity: 1;
      transform: translateX(0);
    }

    .spl-num {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(232, 184, 75, .13);
      border: 1.5px solid rgba(232, 184, 75, .42);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: .73rem;
      font-weight: 500;
      color: #e8b84b;
      flex-shrink: 0;
    }

    .spl-info {
      flex: 1;
      min-width: 0;
    }

    .spl-name {
      font-family: 'DM Sans', sans-serif;
      font-size: .9rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .spl-role {
      font-family: 'DM Sans', sans-serif;
      font-size: .65rem;
      color: rgba(255, 255, 255, .35);
      margin-top: 1px;
      letter-spacing: .04em;
    }

    .spl-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(232, 184, 75, .5);
      flex-shrink: 0;
    }

    .splash-prog-wrap {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, .07);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .splash-prog-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2e5bbd, #e8b84b);
      border-radius: 2px;
      transition: width .4s ease;
    }

    .splash-prog-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: .65rem;
      color: rgba(255, 255, 255, .28);
      letter-spacing: .08em;
      margin-bottom: 4px;
    }

    .splash-enter-btn {
      margin-top: 18px;
      padding: 12px 44px;
      background: linear-gradient(135deg, #e8b84b, #d4a43a);
      color: #0d1b3e;
      border: none;
      border-radius: 30px;
      font-family: 'DM Sans', sans-serif;
      font-size: .88rem;
      font-weight: 700;
      letter-spacing: .06em;
      cursor: pointer;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity .55s ease, transform .55s ease, box-shadow .2s;
    }

    .splash-enter-btn:hover {
      box-shadow: 0 8px 28px rgba(232, 184, 75, .45);
    }

    .splash-enter-btn.spl-vis {
      opacity: 1;
      transform: translateY(0);
    }

    /* ══════════════════════════════════════════════
       APP PRINCIPAL
    ══════════════════════════════════════════════ */
    #app-root {
      opacity: 0;
      transition: opacity .5s ease;
    }

    #app-root.app-visible {
      opacity: 1;
    }

    /* ══════════════════════════════════════════════
       ESTILOS ORIGINALES DE LA APP (sin cambios)
    ══════════════════════════════════════════════ */
    :root {
      --navy: #0d1b3e;
      --navy2: #162250;
      --gold: #e8b84b;
      --gold2: #f5d080;
      --cream: #f7f5ef;
      --cream2: #eee9dc;
      --text: #1a1a2e;
      --text2: #4a4a6a;
      --white: #ffffff;
      --accent: #2e5bbd;
      --accent2: #4a7de8;
      --border: #d8d2c4;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 4px 24px rgba(13, 27, 62, .10);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 60%, #1e3a6e 100%);
      padding: 0 2.5rem;
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 20px rgba(0, 0, 0, .3);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }

    .integral-icon-hdr {
      font-family: 'DM Serif Display', serif;
      font-size: 3rem;
      color: var(--gold);
      line-height: 1;
      margin-top: -4px;
    }

    .header-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1.55rem;
      color: var(--white);
    }

    .header-title span {
      color: var(--gold);
    }

    .header-sub {
      font-size: .75rem;
      color: rgba(255, 255, 255, .5);
      letter-spacing: .07em;
      text-transform: uppercase;
      margin-top: 4px;
      font-weight: 300;
    }

    .header-badge {
      background: rgba(232, 184, 75, .15);
      border: 1px solid rgba(232, 184, 75, .4);
      color: var(--gold2);
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .1em;
      padding: 6px 16px;
      border-radius: 20px;
      text-transform: uppercase;
    }

    nav {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 0 2.5rem;
      display: flex;
      position: sticky;
      top: 88px;
      z-index: 99;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .05);
      overflow-x: auto;
    }

    nav::-webkit-scrollbar {
      height: 3px;
    }

    nav::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 20px;
      height: 54px;
      border: none;
      background: none;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: .87rem;
      font-weight: 500;
      color: var(--text2);
      white-space: nowrap;
      border-bottom: 3px solid transparent;
      margin-bottom: -1px;
      transition: all .2s;
      flex-shrink: 0;
    }

    .nav-btn:hover {
      color: var(--navy);
    }

    .nav-btn.active {
      color: var(--navy);
      border-bottom-color: var(--gold);
      font-weight: 600;
    }

    .nav-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--cream2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .7rem;
      font-weight: 600;
      color: var(--text2);
      flex-shrink: 0;
      transition: all .2s;
    }

    .nav-btn.active .nav-num {
      background: var(--navy);
      color: var(--gold);
    }

    .hamburger {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      width: 40px;
      height: 40px;
      background: rgba(232, 184, 75, .15);
      border: 1px solid rgba(232, 184, 75, .35);
      border-radius: 8px;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
    }

    .hamburger span {
      display: block;
      width: 20px;
      height: 2px;
      background: var(--gold);
      border-radius: 2px;
      transition: all .3s;
    }

    .hamburger.open span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }

    .hamburger.open span:nth-child(2) {
      opacity: 0;
      transform: scaleX(0);
    }

    .hamburger.open span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }

    .nav-drawer {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 200;
    }

    .nav-drawer.open {
      display: block;
    }

    .nav-drawer-overlay {
      position: absolute;
      inset: 0;
      background: rgba(13, 27, 62, .55);
      backdrop-filter: blur(3px);
    }

    .nav-drawer-panel {
      position: absolute;
      top: 0;
      right: 0;
      width: 78%;
      max-width: 300px;
      height: 100%;
      background: var(--white);
      box-shadow: -8px 0 32px rgba(0, 0, 0, .2);
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform .3s cubic-bezier(.4, 0, .2, 1);
    }

    .nav-drawer.open .nav-drawer-panel {
      transform: translateX(0);
    }

    .nav-drawer-header {
      background: linear-gradient(135deg, var(--navy), var(--navy2));
      padding: 20px 20px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-drawer-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1rem;
      color: var(--gold);
    }

    .nav-drawer-close {
      width: 32px;
      height: 32px;
      background: rgba(255, 255, 255, .1);
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 6px;
      color: var(--white);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-drawer-close:hover {
      background: rgba(255, 255, 255, .2);
    }

    .nav-drawer-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      overflow-y: auto;
    }

    .nav-drawer-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--cream);
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: .9rem;
      font-weight: 500;
      color: var(--text);
      transition: all .18s;
      text-align: left;
      width: 100%;
    }

    .nav-drawer-btn:hover {
      background: var(--cream2);
      border-color: var(--navy);
    }

    .nav-drawer-btn.active {
      background: var(--navy);
      border-color: var(--navy);
      color: var(--gold);
      font-weight: 700;
    }

    .nav-drawer-num {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--cream2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .72rem;
      font-weight: 700;
      color: var(--text2);
      flex-shrink: 0;
    }

    .nav-drawer-btn.active .nav-drawer-num {
      background: var(--gold);
      color: var(--navy);
    }

    .nav-drawer-method-name {
      flex: 1;
    }

    .nav-drawer-sub {
      font-size: .7rem;
      color: var(--text2);
      margin-top: 1px;
      font-weight: 400;
    }

    .nav-drawer-btn.active .nav-drawer-sub {
      color: rgba(232, 184, 75, .7);
    }

    .nav-drawer-footer {
      padding: 16px;
      border-top: 1px solid var(--border);
    }

    .nav-active-label {
      font-size: .68rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text2);
      margin-bottom: 6px;
    }

    .nav-active-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--navy);
      color: var(--gold);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: .8rem;
      font-weight: 600;
    }

    @media(max-width:700px) {
      header {
        height: auto;
        padding: 12px 16px;
      }

      .header-sub {
        display: none;
      }

      .integral-icon-hdr {
        font-size: 2rem;
      }

      .header-title {
        font-size: 1.1rem;
      }

      .header-badge {
        display: none;
      }

      nav {
        display: none !important;
      }

      .hamburger {
        display: flex;
      }

      main {
        padding: 1rem 12px;
      }

      .section.active {
        grid-template-columns: 1fr;
      }

      .left-panel {
        position: static;
      }
    }

    main {
      max-width: 1440px;
      margin: 0 auto;
      padding: 2rem;
    }

    .section {
      display: none;
    }

    .section.active {
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 2rem;
      align-items: start;
    }

    .left-panel {
      background: var(--white);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: var(--shadow);
      position: sticky;
      top: 160px;
    }

    .method-header {
      background: linear-gradient(135deg, var(--navy), var(--navy2));
      padding: 1.4rem 1.5rem;
    }

    .method-name-row {
      text-align: center;
      margin-bottom: 1rem;
    }

    .method-name {
      font-family: 'DM Serif Display', serif;
      font-size: 1.2rem;
      color: var(--white);
    }

    .method-sub-lbl {
      font-size: .7rem;
      color: rgba(255, 255, 255, .45);
      letter-spacing: .07em;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .integral-widget {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .integral-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .lim-input {
      width: 60px;
      padding: 5px 6px;
      background: rgba(255, 255, 255, .12);
      border: 1.5px solid rgba(232, 184, 75, .4);
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: .85rem;
      color: var(--gold2);
      text-align: center;
      outline: none;
      transition: border-color .2s;
    }

    .lim-input::placeholder {
      color: rgba(232, 184, 75, .4);
    }

    .lim-input:focus {
      border-color: var(--gold);
      background: rgba(255, 255, 255, .18);
    }

    .lim-label {
      font-size: .65rem;
      color: rgba(255, 255, 255, .4);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .integral-symbol {
      font-family: 'DM Serif Display', serif;
      font-size: 5rem;
      color: var(--gold);
      line-height: 1;
      text-shadow: 0 0 24px rgba(232, 184, 75, .25);
      margin: 0 4px;
    }

    .fx-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: .9rem;
      color: rgba(255, 255, 255, .7);
      margin-left: 4px;
    }

    .left-body {
      padding: 1.2rem 1.3rem;
    }

    .calc-section {
      margin-bottom: 1rem;
    }

    .calc-section-title {
      font-size: .67rem;
      font-weight: 600;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--text2);
      margin-bottom: .45rem;
    }

    .calc-display {
      background: var(--cream);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: .95rem;
      color: var(--text);
      min-height: 38px;
      word-break: break-all;
      margin-bottom: .5rem;
      cursor: text;
    }

    .calc-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }

    .calc-sep {
      grid-column: span 5;
      font-size: .58rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text2);
      padding: 5px 2px 1px;
      border-top: 1px solid var(--cream2);
      margin-top: 2px;
    }

    .ck {
      padding: 6px 3px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--white);
      font-family: 'JetBrains Mono', monospace;
      font-size: .72rem;
      color: var(--text);
      cursor: pointer;
      text-align: center;
      transition: all .13s;
      line-height: 1.3;
      user-select: none;
    }

    .ck:hover {
      background: var(--cream2);
      border-color: var(--accent2);
    }

    .ck:active {
      transform: scale(.93);
    }

    .ck.op {
      background: #eef3fc;
      color: var(--accent);
      border-color: rgba(46, 91, 189, .25);
    }

    .ck.op:hover {
      background: #dce7fa;
    }

    .ck.fn {
      background: #f0faf5;
      color: #1a7a50;
      border-color: rgba(26, 122, 80, .25);
      font-size: .66rem;
    }

    .ck.fn:hover {
      background: #d9f2e6;
    }

    .ck.hyp {

  <script>
    /* ════════════════════════════════════════════
       ↓↓↓ EDITA AQUÍ LOS NOMBRES DEL EQUIPO ↓↓↓
    ════════════════════════════════════════════ */
    const TEAM_MEMBERS = [
      { name: 'Keyner Alfonso Reyes Tejedor', role: 'Integrante del equipo' },
      { name: 'Carlos Andres Ramos Ardila', role: 'Integrante del equipo' },
      { name: 'Luis Angel Diaz Ayola', role: 'Integrante del equipo' },
      { name: 'Gustavo Adolfo Jimenez Medranos', role: 'Integrante del equipo' },
      { name: 'Jose Andres Torres Dias', role: 'Integrante del equipo' },
    ];

    const SPL_MSGS = [
      'Cargando librerías matemáticas…',
      'Inicializando calculadora científica…',
      'Preparando gráficas y tablas…',
      'Configurando los 5 métodos…',
      '¡Todo listo! ✓',
    ];

    /* ─── Splash: construir tarjetas ─── */
    function buildSplash() {
      const list = document.getElementById('splMembers');
      list.innerHTML = TEAM_MEMBERS.map((m, i) => `
        <div class="spl-card" id="splCard${i}">
          <div class="spl-num">0${i + 1}</div>
          <div class="spl-info">
            <div class="spl-name">${m.name}</div>
            <div class="spl-role">${m.role}</div>
          </div>
          <div class="spl-dot"></div>
        </div>`).join('');
    }

    /* ─── Splash: animar ─── */
    function animateSplash() {
      const bar = document.getElementById('splProgBar');
      const lbl = document.getElementById('splProgLabel');
      setTimeout(() => document.getElementById('splBadges').classList.add('spl-vis'), 300);
      TEAM_MEMBERS.forEach((_, i) => {
        setTimeout(() => {
          document.getElementById('splCard' + i).classList.add('spl-vis');
          bar.style.width = Math.round(((i + 1) / TEAM_MEMBERS.length) * 80) + '%';
          lbl.textContent = SPL_MSGS[i] || SPL_MSGS[SPL_MSGS.length - 2];
        }, 500 + i * 350);
      });
      const done = 500 + TEAM_MEMBERS.length * 350 + 350;
      setTimeout(() => {
        bar.style.width = '100%';
        lbl.textContent = SPL_MSGS[SPL_MSGS.length - 1];
        document.getElementById('splEnterBtn').classList.add('spl-vis');
      }, done);
    }

    /* ─── Splash: entrar a la app ─── */
    function enterApp() {
      document.getElementById('splash-overlay').classList.add('hidden');
      document.getElementById('app-root').classList.add('app-visible');
    }

    /* ════════════════════════════════════════════
       DRAWER MÓVIL
    ════════════════════════════════════════════ */
    const DRAWER_NAMES = ['Trapezoidal', 'Jorge Boole', 'Simpson 3/8', 'Simpson 1/3', 'Simpson Abierto'];
    function toggleDrawer() { document.getElementById('navDrawer').classList.contains('open') ? closeDrawer() : openDrawer(); }
    function openDrawer() { document.getElementById('navDrawer').classList.add('open'); document.getElementById('hamburgerBtn').classList.add('open'); document.body.style.overflow = 'hidden'; }
    function closeDrawer() { document.getElementById('navDrawer').classList.remove('open'); document.getElementById('hamburgerBtn').classList.remove('open'); document.body.style.overflow = ''; }

    /* ════════════════════════════════════════════
       CONFIGURACIÓN DE MÉTODOS
    ════════════════════════════════════════════ */
    const METHODS = [
      { id: 0, name: 'Método Trapezoidal', sub: 'Regla Compuesta', hasN: true, formula: 'I = (Δ/2)[ f(x₀) + 2f(x₁) + 2f(x₂) + … + f(xₙ) ]', deltaFormula: 'Δ = (b − a) / n', divisor: 'n' },
      { id: 1, name: 'Método Jorge Boole', sub: 'Newton-Cotes Cerrado', hasN: false, formula: 'I = (2Δ/45)[ 7f(x₁) + 32f(x₂) + 12f(x₃) + 32f(x₄) + 7f(x₅) ]', deltaFormula: 'Δ = (b − a) / 4', divisor: 4 },
      { id: 2, name: 'Simpson 3/8', sub: 'Newton-Cotes — Orden 3', hasN: false, formula: 'I = (3Δ/8)[ f(x₁) + 3f(x₂) + 3f(x₃) + f(x₄) ]', deltaFormula: 'Δ = (b − a) / 3', divisor: 3 },
      { id: 3, name: 'Simpson 1/3', sub: 'Newton-Cotes — Orden 2', hasN: true, formula: 'I = (Δ/3)[ f(x₁) + 4f(x₂) + f(x₃) ]', deltaFormula: 'Δ = (b − a) / 2', divisor: 2 },
      { id: 4, name: 'Simpson Abierto', sub: 'n particiones pares', hasN: true, formula: 'I = (Δ/3)[ f(x₁) + 4f(x₂) + 2f(x₃) + 4f(x₄) + … + f(xₙ) ]', deltaFormula: 'Δ = (b − a) / n', divisor: 'n' },
    ];

    /* ════════════════════════════════════════════
       TECLADO CIENTÍFICO
    ════════════════════════════════════════════ */
    const KB_ROWS = [
      ['__SEP__', 'Trigonométricas'],
      ['sin', 'sin(', 'fn'], ['cos', 'cos(', 'fn'], ['tan', 'tan(', 'fn'], ['asin', 'asin(', 'fn'], ['acos', 'acos(', 'fn'],
      ['__SEP__', ''],
      ['atan', 'atan(', 'fn'], ['sec', '1/cos(', 'fn'], ['csc', '1/sin(', 'fn'], ['cot', '1/tan(', 'fn'], ['sinc', 'sinc(', 'fn'],
      ['__SEP__', 'Hiperbólicas'],
      ['sinh', 'sinh(', 'hyp'], ['cosh', 'cosh(', 'hyp'], ['tanh', 'tanh(', 'hyp'], ['asinh', 'asinh(', 'hyp'], ['acosh', 'acosh(', 'hyp'],
      ['__SEP__', 'Logaritmos y Potencias'],
      ['ln', 'log(', 'fn'], ['log₁₀', 'log10(', 'fn'], ['log₂', 'log2(', 'fn'], ['eˣ', 'exp(', 'fn'], ['√x', 'sqrt(', 'fn'],
      ['__SEP__', ''],
      ['∛x', 'cbrt(', 'fn'], ['x²', '^2', 'op'], ['xⁿ', '^', 'op'], ['10ˣ', '10^(', 'op'], ['nPr', 'permutations(', 'fn'],
      ['__SEP__', 'Constantes y Funciones'],
      ['π', 'pi', 'cst'], ['e', 'e', 'cst'], ['φ', '1.6180339887', 'cst'], ['|x|', 'abs(', 'fn'], ['ceil', 'ceil(', 'fn'],
      ['__SEP__', ''],
      ['floor', 'floor(', 'fn'], ['round', 'round(', 'fn'], ['sign', 'sign(', 'fn'], ['mod', '%', 'op'], ['!', '!', 'op'],
      ['__SEP__', 'Operadores'],
      ['(', '(', 'op'], [')', ')', 'op'], ['+', '+', 'op'], ['−', '-', 'op'], ['×', '*', 'op'],
      ['__SEP__', ''],
      ['÷', '/', 'op'], ['.', '.', ''], ['x', 'x', 'fn'], ['⌫', '__DEL__', 'red'], ['C', '__CLR__', 'red'],
      ['__SEP__', 'Números'],
      ['7', '7', ''], ['8', '8', ''], ['9', '9', ''], ['4', '4', ''], ['5', '5', ''],
      ['6', '6', ''], ['1', '1', ''], ['2', '2', ''], ['3', '3', ''],
      ['__SPAN2__', '0', ''], ['.', '.', ''],
    ];

    function buildCalcHTML(id) {
      let html = `<div class="calc-section"><div class="calc-section-title">Calculadora Científica — f(x)</div><div class="calc-display" id="m${id}-display">f(x)</div><div class="calc-grid">`;
      let i = 0;
      while (i < KB_ROWS.length) {
        const row = KB_ROWS[i];
        if (row[0] === '__SEP__') { html += row[1] ? `<div class="calc-sep">${row[1]}</div>` : `<div class="calc-sep" style="border:none;padding-top:0;"></div>`; i++; continue; }
        if (row[0] === '__SPAN2__') { const ins = row[1].replace(/'/g, "\\'"); html += `<button class="ck span2 ${row[2]}" onclick="kbIns(${id},'${ins}')">${row[1]}</button>`; i++; continue; }
        const ins = row[1].replace(/'/g, "\\'");
        html += `<button class="ck ${row[2]}" onclick="kbIns(${id},'${ins}')">${row[0]}</button>`;
        i++;
      }
      html += `</div><button class="use-btn" onclick="useFx(${id})">✓ Usar como f(x)</button></div>`;
      return html;
    }

    /* ════════════════════════════════════════════
       RENDER SECCIONES
    ════════════════════════════════════════════ */
    function buildSections() {
      document.getElementById('mainContent').innerHTML = METHODS.map(m => `
<section class="section${m.id === 0 ? ' active' : ''}" id="m${m.id}">
  <div class="left-panel">
    <div class="method-header">
      <div class="method-name-row"><div class="method-name">${m.name}</div><div class="method-sub-lbl">${m.sub}</div></div>
      <div class="integral-widget">
        <div class="integral-column">
          <div class="lim-label">b</div>
          <input class="lim-input" type="number" id="m${m.id}-b" placeholder="b" step="any"/>
          <input class="lim-input" type="number" id="m${m.id}-a" placeholder="a" step="any" style="margin-top:18px"/>
          <div class="lim-label">a</div>
        </div>
        <div class="integral-symbol">∫</div>
        <div class="fx-display" id="m${m.id}-fxdisp">f(x) dx</div>
      </div>
    </div>
    <div class="left-body">
      ${buildCalcHTML(m.id)}
      ${m.hasN ? `<div class="inp-group"><div class="inp-label">Subintervalos <code>n</code></div><input type="number" id="m${m.id}-n" value="${m.id === 0 ? 6 : m.id === 3 ? 2 : 4}" min="2"/></div>` : ''}
      <div class="formula-section"><div class="formula-title">Fórmula del Método</div><div class="formula-display">${m.formula}</div></div>
      <div class="delta-section">
        <div class="delta-title">Cálculo de Δ — ${m.deltaFormula}</div>
        <div class="delta-row">
          <span class="delta-op">Δ =</span>
          <span class="delta-val" id="m${m.id}-dv-b">b</span>
          <span class="delta-op">−</span>
          <span class="delta-val" id="m${m.id}-dv-a">a</span>
          <span class="delta-op">÷</span>
          <span class="delta-val" id="m${m.id}-dv-div">${typeof m.divisor === 'number' ? m.divisor : 'n'}</span>
          <span class="delta-op">=</span>
          <span class="delta-result-big" id="m${m.id}-delta-res">—</span>
        </div>
        <div class="delta-formula-eq" id="m${m.id}-delta-eq"></div>
      </div>
      <button class="btn-calc" onclick="calc(${m.id})">Calcular Integral ∫</button>
      <button class="btn-reset" onclick="resetMethod(${m.id})">↺ Resetear</button>
    </div>
  </div>
  <div class="right-panel">
    <div class="card"><div class="card-header"><div class="card-icon">∑</div><div class="card-title">Tabla de Iteraciones y Sumatoria</div></div><div class="card-body"><div id="m${m.id}-tbl">${emptyHTML()}</div></div></div>
    <div class="card"><div class="card-header"><div class="card-icon">◉</div><div class="card-title">Puntos para Graficar</div></div><div class="card-body"><div id="m${m.id}-pts">${emptyHTML('Los puntos xᵢ, f(xᵢ) aparecen aquí')}</div></div></div>
    <div class="card"><div class="card-header"><div class="card-icon">〜</div><div class="card-title">Gráfica de f(x)</div></div><div class="card-body"><div class="chart-container"><canvas id="chart${m.id}"></canvas></div></div></div>
  </div>
</section>`).join('');
      METHODS.forEach(m => setupABListeners(m));
    }

    function emptyHTML(msg = 'Ingresa los valores y presiona Calcular') {
      return `<div class="empty-state"><div class="empty-icon">∫</div><div class="empty-text">${msg}</div></div>`;
    }

    /* ════════════════════════════════════════════
       NAVEGACIÓN
    ════════════════════════════════════════════ */
    function switchMethod(i) {
      document.querySelectorAll('.section').forEach((s, j) => s.classList.toggle('active', i === j));
      document.querySelectorAll('.nav-btn').forEach((b, j) => b.classList.toggle('active', i === j));
      document.querySelectorAll('.nav-drawer-btn').forEach((b, j) => b.classList.toggle('active', i === j));
      const numEl = document.getElementById('drawerActiveNum'), nameEl = document.getElementById('drawerActiveName');
      if (numEl) numEl.textContent = i + 1;
      if (nameEl) nameEl.textContent = DRAWER_NAMES[i];
    }

    /* ════════════════════════════════════════════
       CALCULADORA
    ════════════════════════════════════════════ */
    const calcExpr = {};
    function getExpr(id) { return calcExpr[id] || ''; }
    function setExpr(id, v) { calcExpr[id] = v; document.getElementById('m' + id + '-display').textContent = v || 'f(x)'; }
    function kbIns(id, ch) {
      if (ch === '__CLR__') { setExpr(id, ''); return; }
      if (ch === '__DEL__') { setExpr(id, getExpr(id).slice(0, -1)); return; }
      setExpr(id, getExpr(id) + ch);
    }
    function useFx(id) {
      const expr = getExpr(id);
      if (!expr) { alert('Escribe primero una función usando la calculadora.'); return; }
      try { math.evaluate(expr, { x: 1 }); }
      catch (e) { alert('Función inválida: ' + e.message + '\n\nEjemplo: sin(x), x^2+1, exp(x)'); return; }
      document.getElementById('m' + id + '-fxdisp').textContent = expr + ' dx';
    }

    /* ════════════════════════════════════════════
       A / B → delta en tiempo real
    ════════════════════════════════════════════ */
    function setupABListeners(m) {
      const aEl = document.getElementById('m' + m.id + '-a');
      const bEl = document.getElementById('m' + m.id + '-b');
      const nEl = m.hasN ? document.getElementById('m' + m.id + '-n') : null;
      function upd() {
        const a = parseFloat(aEl.value), b = parseFloat(bEl.value);
        const div = typeof m.divisor === 'number' ? m.divisor : (nEl ? parseFloat(nEl.value) : NaN);
        document.getElementById('m' + m.id + '-dv-b').textContent = isNaN(b) ? 'b' : b;
        document.getElementById('m' + m.id + '-dv-a').textContent = isNaN(a) ? 'a' : a;
        document.getElementById('m' + m.id + '-dv-div').textContent = isNaN(div) ? 'n' : div;
        if (!isNaN(a) && !isNaN(b) && !isNaN(div) && div !== 0) {
          const d = (b - a) / div;
          document.getElementById('m' + m.id + '-delta-res').textContent = d.toFixed(6);
          document.getElementById('m' + m.id + '-delta-eq').textContent = `(${b} − ${a}) / ${div} = ${d.toFixed(6)}`;
        } else {
          document.getElementById('m' + m.id + '-delta-res').textContent = '—';
          document.getElementById('m' + m.id + '-delta-eq').textContent = '';
        }
      }
      aEl.addEventListener('input', upd);
      bEl.addEventListener('input', upd);
      if (nEl) nEl.addEventListener('input', upd);
    }

    /* ════════════════════════════════════════════
       EVALUAR f(x)
    ════════════════════════════════════════════ */
    function evalF(expr, x) { try { return math.evaluate(expr, { x }); } catch { return NaN; } }

    /* ════════════════════════════════════════════
       CHARTS
    ════════════════════════════════════════════ */
    const charts = {};
    function destroyChart(i) { if (charts[i]) { charts[i].destroy(); delete charts[i]; } }
    function drawChart(idx, fxExpr, pts) {
      destroyChart(idx);
      const xs = pts.map(p => p.x), minX = Math.min(...xs), maxX = Math.max(...xs);
      const steps = 300, step = (maxX - minX) / steps, curve = [];
      for (let i = 0; i <= steps; i++) { const x = minX + i * step; curve.push({ x, y: evalF(fxExpr, x) }); }
      const ctx = document.getElementById('chart' + idx).getContext('2d');
      charts[idx] = new Chart(ctx, {
        type: 'line',
        data: {
          datasets: [
            { label: 'f(x)', data: curve, borderColor: '#2e5bbd', borderWidth: 2, pointRadius: 0, fill: true, backgroundColor: 'rgba(46,91,189,.08)', tension: 0.4 },
            { label: 'Puntos xᵢ', data: pts, borderColor: '#e8b84b', backgroundColor: '#e8b84b', pointRadius: 7, pointHoverRadius: 9, type: 'scatter', showLine: false }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { labels: { color: '#1a1a2e', font: { family: 'DM Sans', size: 12 } } } },
          scales: {
            x: { type: 'linear', title: { display: true, text: 'x', color: '#4a4a6a' }, grid: { color: 'rgba(0,0,0,.05)' }, ticks: { color: '#4a4a6a', font: { family: 'JetBrains Mono', size: 11 } } },
            y: { title: { display: true, text: 'f(x)', color: '#4a4a6a' }, grid: { color: 'rgba(0,0,0,.05)' }, ticks: { color: '#4a4a6a', font: { family: 'JetBrains Mono', size: 11 } } }
          }
        }
      });
    }

    /* ════════════════════════════════════════════
       RENDER TABLA + RESULTADO
    ════════════════════════════════════════════ */
    function renderTable(rows, I, deltaVal, multiplierStr, wrapId) {
      const sumCoefFx = rows.reduce((s, r) => s + r.coefFx, 0);
      let html = `<div class="tbl-wrap"><table><thead><tr><th>I</th><th>Xᵢ</th><th>F(Xᵢ)</th><th>COEF.</th><th>COEF × F(Xᵢ)</th></tr></thead><tbody>`;
      rows.forEach(r => { html += `<tr><td>${r.i}</td><td>${r.x.toFixed(8)}</td><td>${r.fx.toFixed(8)}</td><td>${r.coef}</td><td>${r.coefFx.toFixed(8)}</td></tr>`; });
      html += `<tr class="sum-row"><td colspan="4" style="text-align:right">Σ (Coef × f(xᵢ)) =</td><td>${sumCoefFx.toFixed(8)}</td></tr></tbody></table></div>`;
      html += `<div class="result-bar"><div><div class="result-lbl">Integral Aproximada</div><div class="result-formula">${multiplierStr} × ${sumCoefFx.toFixed(6)}</div></div><div class="result-val">I ≈ ${I.toFixed(10)}</div></div>`;
      document.getElementById(wrapId).innerHTML = html;
    }

    function renderPoints(rows, wrapId) {
      let html = `<div class="tbl-wrap"><table><thead><tr><th>I</th><th>Xᵢ</th><th>F(Xᵢ)</th></tr></thead><tbody>`;
      rows.forEach(r => { html += `<tr><td>${r.i}</td><td>${r.x.toFixed(8)}</td><td>${r.fx.toFixed(8)}</td></tr>`; });
      html += `</tbody></table></div>`;
      document.getElementById(wrapId).innerHTML = html;
    }

    /* ════════════════════════════════════════════
       RESET
    ════════════════════════════════════════════ */
    function resetMethod(id) {
      setExpr(id, '');
      document.getElementById('m' + id + '-fxdisp').textContent = 'f(x) dx';
      document.getElementById('m' + id + '-a').value = '';
      document.getElementById('m' + id + '-b').value = '';
      const nEl = document.getElementById('m' + id + '-n');
      if (nEl) nEl.value = id === 0 ? 6 : id === 3 ? 2 : 4;
      ['dv-b', 'dv-a', 'dv-div'].forEach(k => {
        const el = document.getElementById('m' + id + '-' + k);
        if (el) el.textContent = k.includes('div') ? (METHODS[id].divisor === 'n' ? 'n' : METHODS[id].divisor) : k.includes('b') ? 'b' : 'a';
      });
      document.getElementById('m' + id + '-delta-res').textContent = '—';
      document.getElementById('m' + id + '-delta-eq').textContent = '';
      document.getElementById('m' + id + '-tbl').innerHTML = emptyHTML();
      document.getElementById('m' + id + '-pts').innerHTML = emptyHTML('Los puntos xᵢ, f(xᵢ) aparecen aquí');
      destroyChart(id);
    }

    /* ════════════════════════════════════════════
       CALC DISPATCHER
    ════════════════════════════════════════════ */
    function calc(id) {
      const fxExpr = getExpr(id);
      if (!fxExpr) { alert('Escribe una función f(x) y presiona "✓ Usar como f(x)".'); return; }
      const a = parseFloat(document.getElementById('m' + id + '-a').value);
      const b = parseFloat(document.getElementById('m' + id + '-b').value);
      if (isNaN(a) || isNaN(b)) { alert('Ingresa los límites a y b.'); return; }
      if (a >= b) { alert('El límite a debe ser menor que b.'); return; }
      if (id === 0) calcTrap(a, b, fxExpr);
      else if (id === 1) calcBoole(a, b, fxExpr);
      else if (id === 2) calcS38(a, b, fxExpr);
      else if (id === 3) calcS13(a, b, fxExpr);
      else if (id === 4) calcSA(a, b, fxExpr);
    }

    /* ════════════════════════════════════════════
       MÉTODOS DE CÁLCULO (100% sin cambios)
    ════════════════════════════════════════════ */
    function calcTrap(a, b, fx) {
      const n = parseInt(document.getElementById('m0-n').value) || 6;
      const d = (b - a) / n, rows = [];
      for (let i = 0; i <= n; i++) { const x = a + i * d, f = evalF(fx, x), coef = (i === 0 || i === n) ? 1 : 2; rows.push({ i, x, fx: f, coef, coefFx: coef * f }); }
      const sum = rows.reduce((s, r) => s + r.coefFx, 0), I = (d / 2) * sum;
      renderTable(rows, I, d, `(${d.toFixed(6)}/2)`, 'm0-tbl'); renderPoints(rows, 'm0-pts'); drawChart(0, fx, rows.map(r => ({ x: r.x, y: r.fx })));
    }
    function calcBoole(a, b, fx) {
      const d = (b - a) / 4, coefs = [7, 32, 12, 32, 7], rows = [];
      for (let i = 0; i < 5; i++) { const x = a + i * d, f = evalF(fx, x); rows.push({ i: i + 1, x, fx: f, coef: coefs[i], coefFx: coefs[i] * f }); }
      const sum = rows.reduce((s, r) => s + r.coefFx, 0), I = (2 * d / 45) * sum;
      renderTable(rows, I, d, `(2×${d.toFixed(6)}/45)`, 'm1-tbl'); renderPoints(rows, 'm1-pts'); drawChart(1, fx, rows.map(r => ({ x: r.x, y: r.fx })));
    }
    function calcS38(a, b, fx) {
      const d = (b - a) / 3, coefs = [1, 3, 3, 1], rows = [];
      for (let i = 0; i < 4; i++) { const x = a + i * d, f = evalF(fx, x); rows.push({ i: i + 1, x, fx: f, coef: coefs[i], coefFx: coefs[i] * f }); }
      const sum = rows.reduce((s, r) => s + r.coefFx, 0), I = (3 * d / 8) * sum;
      renderTable(rows, I, d, `(3×${d.toFixed(6)}/8)`, 'm2-tbl'); renderPoints(rows, 'm2-pts'); drawChart(2, fx, rows.map(r => ({ x: r.x, y: r.fx })));
    }
    function calcS13(a, b, fx) {
      let n = parseInt(document.getElementById('m3-n').value) || 2;
      if (n % 2 !== 0) n++;
      const d = (b - a) / n, rows = [];
      for (let i = 0; i <= n; i++) { const x = a + i * d, f = evalF(fx, x); let coef = 1; if (i > 0 && i < n) coef = i % 2 === 0 ? 2 : 4; rows.push({ i: i + 1, x, fx: f, coef, coefFx: coef * f }); }
      const sum = rows.reduce((s, r) => s + r.coefFx, 0), I = (d / 3) * sum;
      renderTable(rows, I, d, `(${d.toFixed(6)}/3)`, 'm3-tbl'); renderPoints(rows, 'm3-pts'); drawChart(3, fx, rows.map(r => ({ x: r.x, y: r.fx })));
    }
    function calcSA(a, b, fx) {
      let n = parseInt(document.getElementById('m4-n').value) || 4;
      if (n % 2 !== 0) n++;
      const d = (b - a) / n, rows = [];
      for (let i = 0; i <= n; i++) {
        const x = a + i * d, f = evalF(fx, x);
        let coef;
        if (i === 0 || i === n) coef = 1;
        else if (i % 2 !== 0) coef = 4;
        else coef = 2;
        rows.push({ i, x, fx: f, coef, coefFx: coef * f });
      }
      const sum = rows.reduce((s, r) => s + r.coefFx, 0), I = (d / 3) * sum;
      renderTable(rows, I, d, `(${d.toFixed(6)}/3)`, 'm4-tbl'); renderPoints(rows, 'm4-pts'); drawChart(4, fx, rows.map(r => ({ x: r.x, y: r.fx })));
    }

    /* ════════════════════════════════════════════
       INIT
    ════════════════════════════════════════════ */
    buildSections();
    buildSplash();
    animateSplash();
  </script>
</body>

</html>
